services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_PASSWORD: "@xZ0041105"
      POSTGRES_USER: sorasak
      POSTGRES_DB: sorasak
    volumes:
      - ./data/data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
    depends_on:
      - db
  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - "9091:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORTS: 5432
      DATABASE_USER: sorasak
      DATABASE_PASSWORD: "@xZ0041105"


